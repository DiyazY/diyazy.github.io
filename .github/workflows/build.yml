name: Build

# The site deploys via the GitHub Pages classic build, which has no PR check.
# Without this workflow a Liquid or YAML error reaches production and is only
# visible as a Pages build-failure email. llms.txt is advertised to crawlers in
# robots.txt via `LLMs-Txt:`, so a broken build 404s a URL we publish.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check generated output
        run: ./.github/scripts/check-build.sh _site
