name: Build and deploy

# Builds on every PR, and builds + deploys on main.
#
# The site previously deployed through the legacy Pages builder, which pins the
# github-pages gem (Jekyll 3.x) while this repo's Gemfile resolves Jekyll 4.
# That meant production ran a different renderer than anything under test.
# Deploying from here closes the gap: the artifact that ships is the one the
# checks ran against.
#
# Requires the repository's Pages build type to be "workflow" rather than
# "legacy". With build_type: legacy this workflow builds but never publishes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "notify job: list the posts it would announce, send nothing"
        type: boolean
        default: false
  # Weekly rollout of future-dated posts (e.g. the "After the Feed" series):
  # rebuild every Wednesday 14:00 UTC so a post dated that morning reveals on
  # its date. Scheduled runs use the default branch (main), so the deploy job
  # (gated on refs/heads/main) publishes. If GitHub ever skips a run, trigger
  # this workflow manually (workflow_dispatch) to catch up.
  schedule:
    - cron: '0 14 * * 3'

permissions:
  contents: read

# Supersede in-flight PR builds, but never cancel a deploy that is mid-flight.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Test Medium sync script
        run: bundle exec ruby ./.github/scripts/medium-sync-test/run_tests.rb

      - name: Build site
        run: bundle exec jekyll build --trace --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check generated output
        run: ./.github/scripts/check-build.sh _site

      # Validate scheduled posts too. The production build above sets
      # future: false, so future-dated posts (e.g. a drip series) are excluded
      # and never build in CI — a broken one would stay green until it reveals.
      # Build again with --future into a throwaway dir so those posts are
      # compiled and checked now. This output is validation-only; it is never
      # uploaded or deployed (the artifact ships the production _site).
      - name: Validate scheduled (future-dated) posts
        run: |
          bundle exec jekyll build --future --trace --strict_front_matter -d _site_future
          ./.github/scripts/check-build.sh _site_future
        env:
          JEKYLL_ENV: production
          # posts.json in this throwaway build legitimately lists future posts.
          CHECK_ALLOW_FUTURE: '1'

      # Only main produces a publishable artifact; PR runs stop at the checks.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The notify job reads posts.json from this exact build, not the live
      # site (GitHub Pages caches responses for ~10 minutes).
      - name: Upload posts.json for notify
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: posts-json
          path: _site/posts.json
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Subscribe Worker + announcer (workers/subscribe/): types, tests, and a
  # dry-run bundle so a Worker-only build error fails CI, not the deploy.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/subscribe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/subscribe/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle without deploying
        run: npm run build:check

  # Emails newly published posts to subscribers (a Resend broadcast scheduled
  # 2 hours out, plus a heads-up to the author). Runs after every deploy of
  # main, including the Wednesday cron that reveals scheduled posts. Skipped
  # until ANNOUNCE_SINCE exists (i.e. before launch); the script also refuses
  # to run without it. Logs are public: the script prints titles and IDs only.
  notify:
    if: github.ref == 'refs/heads/main' && vars.ANNOUNCE_SINCE != ''
    needs: [deploy, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers/subscribe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/subscribe/package-lock.json

      - run: npm ci

      - name: Download posts.json from this build
        uses: actions/download-artifact@v4
        with:
          name: posts-json
          path: ${{ runner.temp }}/posts

      - name: Announce new posts
        run: node scripts/notify.ts "$RUNNER_TEMP/posts/posts.json"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_NOTIFY }}
          NOTIFY_REPLY_TO: ${{ secrets.NOTIFY_REPLY_TO }}
          ANNOUNCE_SINCE: ${{ vars.ANNOUNCE_SINCE }}
          RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}
          TOPIC_NEW_POSTS_ID: ${{ vars.TOPIC_NEW_POSTS_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
