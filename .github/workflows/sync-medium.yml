name: Sync Medium Posts

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install dependencies
        run: |
          gem install feedjira httparty nokogiri reverse_markdown

      # Pre-flight gate: run the script against local fixtures before the
      # live sync, so a regression (or a breaking release of the unpinned
      # gems above) fails loudly here instead of half-syncing the feed.
      - name: Test sync script against fixtures
        run: ruby ./.github/scripts/medium-sync-test/run_tests.rb

      - name: Sync posts from Medium
        run: ruby ./medium_to_md.rb diyaz.yakubov ./_posts

      - name: Check for new posts
        id: changes
        run: |
          if [ -n "$(git status --porcelain _posts/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request with new posts
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync new posts from Medium"
          branch: sync-medium-posts
          title: "Sync new posts from Medium"
          body: "Automated sync of new posts from Medium RSS feed."
          delete-branch: true
