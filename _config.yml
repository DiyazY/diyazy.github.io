# Site settings
title: diyaz
description: "Personal blog and portfolio of Diyaz Yakubov - sharing adventures in tech, DIY projects, and home lab experiments."
url: "https://diyaz.dev"
baseurl: ""
author:
  name: Diyaz Yakubov
  email: ""
  github: DiyazY
  linkedin: diyaz-y-4ba636116
  medium: diyaz.yakubov
  orcid: "0009-0000-7989-4614"
  toptal: diyaz-yakubov

# Build settings
# Pinned so post permalinks don't depend on the build machine's clock. Post
# dates carry UTC timestamps; without this, anything stamped 21:00-24:00 UTC
# resolves to a different day (and a different URL) when built east of
# Greenwich. UTC matches every URL published so far.
timezone: UTC
lsi: false
source: ./
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Kept in the repo, not published. The legacy Pages builder rendered
# ROADMAP.md to /ROADMAP.html and listed it in the sitemap; it is an internal
# planning document, so it is now excluded outright rather than shipped as raw
# markdown. Merged with Jekyll's default excludes, not replacing them.
exclude:
  - ROADMAP.md

# Analytics (PostHog, EU cloud)
# Privacy-first setup: the snippet in _includes/analytics.html runs PostHog in
# cookieless mode, so it sets no cookies and uses no local/session storage and
# needs no consent banner (visitor identity is a server-side daily hash). This
# matches the "no cookie banner needed" goal in ROADMAP.md.
#
# api_key is the *public* project key (phc_...). It is designed to ship in
# client HTML and is safe to commit. Leave it empty to disable analytics
# entirely — the snippet is skipped when api_key is blank, so local builds and
# forks stay tracking-free.
#
# NOTE: cookieless mode must also be enabled in the PostHog project under
# Settings > Web analytics > "Cookieless server hash mode", or events are
# silently dropped.
posthog:
  api_key: "phc_Ab5m9tpLKS9gaXkirx4xmjz3Z8SWtvJQ3iFmHNCNTD3U"
  api_host: "https://eu.i.posthog.com"

# Plugins
plugins:
  - jekyll-sitemap

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"