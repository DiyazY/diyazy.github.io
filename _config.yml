# Site settings
title: Diyaz's Website
description: "Personal blog and portfolio of Diyaz Yakubov - sharing adventures in tech, DIY projects, and home lab experiments."
url: "https://diyazy.github.io"
baseurl: ""
author:
  name: Diyaz Yakubov
  email: ""
  github: DiyazY
  linkedin: ""
  medium: diyaz.yakubov

# Build settings
lsi: false
source: ./
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-sitemap

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"