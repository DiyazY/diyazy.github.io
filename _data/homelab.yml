# Home lab inventory. Single source for /homelab.html: the 3D scene, the info
# cards and the plain-HTML device list all read this file.
#
# Public page, so: hardware, roles and service names only. Never add IPs,
# hostnames, Tailscale/MagicDNS names, ports or SSH details — check-build.sh
# fails the build if the page looks like it leaks any.
#
# Per device:
#   id        stable slug; the scene and the list key on it
#   name      display name
#   short     optional shorter name for the network-view label
#   model     hardware model
#   specs     one short line
#   role      one line, what it is for
#   services  list of what runs on it (may be empty)
#   kind      mesh to draw: nuc jetson seeed pi4 pi3 pi-zero switch router
#             nas fan ruuvi
#   tier      shelf, top to bottom: network servers gpu pis storage; cooling
#             sits on the cabinet roof. Position within a shelf follows the
#             order of this file.
#   uplink    id of the device it plugs into, or "internet". Omit for things
#             with no network link (fans, sensor). Builds the network view.
#   link      usb-c-40g for the Jetson <-> Seeed pairing; ethernet otherwise
#   links     optional [{label, url}] shown on the device's card

intro: >-
  Two NUCs, a Jetson-and-Seeed GPU pair, seven Raspberry Pis and a NAS in one
  cabinet. It runs a K3s cluster, local LLM inference and the self-hosted
  services I use every day, and every machine in it is provisioned from code.
  Drag to look around, pick a device to see what it does, or switch to the
  network view to see how it all connects.

devices:
  - id: deco
    name: TP-Link Deco
    short: Deco
    model: TP-Link Deco mesh router
    specs: Mesh WiFi · gigabit WAN/LAN
    role: Gateway, DHCP and WiFi
    services: []
    kind: router
    tier: network
    uplink: internet

  - id: sg108
    name: TL-SG108
    model: TP-LINK TL-SG108
    specs: 8-port gigabit switch
    role: Primary switch
