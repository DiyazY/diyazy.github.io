# Projects content. Single source for both projects.html and llms.txt.
#
# Rendered by projects.html via _includes/project-card.html, and by llms.txt
# (which has front matter and loops over this same file).
#
# Per group:
#   section       heading shown on the projects page
#   layout        "cards" (default) or "grid" for the compact tile grid
#   llms_section  which llms.txt heading these items belong under, and the sole
#                 selector for it. llms.txt derives its headings from these
#                 values in data order, so a new one appears there
#                 automatically rather than silently vanishing. The page's four
#                 sections collapse into llms.txt's three — Live and
#                 "Tools & Systems" both land under "Projects".
#                 Omit to exclude a group from llms.txt entirely.
#   llms_format   rendering only, never selection. "inline" emits one
#                 comma-joined line instead of bullets.
#
# Per item:
#   name         required
#   image        filename in assets/images/projects/. Omit, or set to null or
#                "", for a compact image-less card (.project-card--compact).
#   badge        text + style; style maps to the CSS class badge-{style}
#                (live, research, soon, tool, wip)
#   description  long form, shown on the projects page
#   summary      one line, used by llms.txt. Deliberately separate: the page
#                is for humans browsing, llms.txt is a compact machine summary
#                and must stay terse.
#   tech         list of tag labels (page only)
#   post_slug    substring of a post URL. Resolved against site.posts at build
#                time; renders a "Read the story" link only if a post matches,
#                so a renamed post degrades to no link rather than a 404.
#   links        list of { label, url, icon }; icon is globe | github | paper.
#                llms.txt links to the first entry, or emits a bare name if
#                there are none. summary is likewise optional there.

