---
layout: default
---

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/post.css">

<div class="panel-container post-container">
    <article class="article-post text-panel">
        <div class="post-header">
            <a href="{{ site.baseurl }}/blog" class="back-link">&larr; Back to Blog</a>
        </div>
        <h1 class="post-title">{{ page.title }}</h1>
        <p class="post-meta"><small>Published on {{ page.date | date: "%B %d, %Y" }}</small></p>

        <div class="post-content">
            {{ content }}
        </div>
    </article>
</div>
