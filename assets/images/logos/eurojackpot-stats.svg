<!-- EuroJackpot Stats ball from eurojackpotstats.eu. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6E93F0"/>
      <stop offset="100%" style="stop-color:#1E42A8"/>
    </linearGradient>
    <linearGradient id="euroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6C763"/>
      <stop offset="100%" style="stop-color:#C77E10"/>
    </linearGradient>
  </defs>
  <!-- Main ball -->
  <circle cx="16" cy="16" r="14" fill="url(#ballGradient)"/>
  <!-- Shine effect -->
  <ellipse cx="12" cy="10" rx="4" ry="3" fill="rgba(255,255,255,0.3)"/>
  <!-- EJ text -->
  <text x="16" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">EJ</text>
</svg>
